<style>
  :root{
    --der: #2F6FED;
    --der-dark: #1E4FBE;
    --die: #FF3E7C;
    --die-dark: #D9245C;
    --das: #F2B705;
    --das-dark: #C79300;
    --bg-top: #fff5f7;
    --bg-bot: #fef6e8;
    --ink: #2b2438;
    --muted: #8b8496;
    --card-bg: #ffffff;
    --wrong: #7a7683;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin:0; padding:0; height:100%;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  body{
    height: 100svh;
    height: 100dvh;
    display:flex;
    flex-direction:column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bot));
    color: var(--ink);
    overflow:hidden;
    user-select:none;
    position:fixed;
    inset:0;
  }

  /* ---------- Header ---------- */
  header{
    flex: 0 0 auto;
    padding: calc(10px + var(--safe-t)) calc(16px + var(--safe-r)) 8px calc(16px + var(--safe-l));
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .logo{
    font-weight:800;
    font-size: clamp(18px, 5.5vw, 22px);
    letter-spacing:-0.02em;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .logo .flame{ filter: drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
  .stats{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .pill{
    background: rgba(255,255,255,0.75);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 13px;
    font-weight:700;
    color: var(--ink);
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    white-space:nowrap;
  }
  .pill.streak{ color:#c2410c; }
  .pill.streak.hot{ animation: pulseStreak 0.5s ease; }
  @keyframes pulseStreak{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }

  /* ---------- Level selector ---------- */
  .level-bar{
    flex: 0 0 auto;
    display:flex;
    justify-content:center;
    padding: 0 calc(16px + var(--safe-r)) 6px calc(16px + var(--safe-l));
  }
  .level-group{
    display:flex;
    background: rgba(0,0,0,0.05);
    border-radius: 999px;
    padding: 3px;
    gap: 3px;
  }
  .level-btn{
    border:none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight:800;
    padding: 6px 16px;
    min-height: 30px;
    border-radius: 999px;
    cursor:pointer;
    touch-action: manipulation;
    -webkit-user-select:none;
  }
  .level-btn.active{
    background: var(--ink);
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .level-btn:active{ transform: scale(0.95); }

  /* ---------- Card stack ---------- */
  .stage{
    flex: 1 1 auto;
    position: relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
    padding: 4px 14px;
  }
  .stack{
    position:relative;
    width: min(90vw, 360px);
    height: min(58dvh, 62svh, 460px);
    max-height: 100%;
  }
  .card{
    position:absolute;
    inset:0;
    background: var(--card-bg);
    border-radius: 26px;
    box-shadow: 0 10px 30px rgba(60,30,60,0.14), 0 2px 8px rgba(60,30,60,0.08);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 20px;
    text-align:center;
    touch-action: none;
    will-change: transform;
    transition: transform 0.32s cubic-bezier(.2,.9,.3,1.3), opacity 0.32s ease;
  }
  .card.dragging{ transition: none; }
  .card.pos-0{ z-index:3; transform: translate(0,0) scale(1) rotate(0deg); opacity:1; }
  .card.pos-1{ z-index:2; transform: translate(0,14px) scale(0.95) rotate(0deg); opacity:0.9; }
  .card.pos-2{ z-index:1; transform: translate(0,26px) scale(0.90) rotate(0deg); opacity:0.75; }

  .card .word{
    font-size: clamp(30px, 9vw, 44px);
    font-weight:800;
    letter-spacing:-0.01em;
    color: var(--ink);
    word-break: break-word;
  }
  .card .subhint{
    margin-top:10px;
    font-size: 13px;
    color: var(--muted);
    font-weight:600;
    letter-spacing:0.02em;
  }
  .card .gender-q{
    margin-top:22px;
    display:flex;
    gap:10px;
  }
  .gq{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:800; color:#fff; opacity:0.85;
  }
  .gq.q-der{ background: var(--der); }
  .gq.q-die{ background: var(--die); }
  .gq.q-das{ background: var(--das); color:#3a2c00; }

  /* stamps */
  .stamp{
    position:absolute;
    top: 26px;
    padding: 6px 14px;
    border-radius: 10px;
    border: 4px solid currentColor;
    font-size: clamp(20px,6vw,28px);
    font-weight:900;
    letter-spacing:0.04em;
    text-transform:uppercase;
    opacity:0;
    pointer-events:none;
    transform: rotate(-18deg) scale(0.8);
    transition: opacity 0.08s linear;
  }
  .stamp.der{ left:20px; color: var(--der); transform: rotate(-18deg) scale(0.8); }
  .stamp.die{ right:20px; color: var(--die); transform: rotate(18deg) scale(0.8); }
  .stamp.das{ left:50%; top:14px; transform: translateX(-50%) rotate(0deg) scale(0.8); color: var(--das-dark); }

  /* ---------- Buttons ---------- */
  .controls{
    flex: 0 0 auto;
    display:flex;
    gap: 10px;
    justify-content:center;
    align-items:center;
    padding: 10px calc(16px + var(--safe-r)) calc(14px + var(--safe-b)) calc(16px + var(--safe-l));
  }
  .gbtn{
    flex: 1 1 0;
    max-width: 150px;
    min-height: 52px;
    border-radius: 18px;
    border: none;
    font-size: 16px;
    font-weight:800;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    cursor:pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,0.12);
    -webkit-user-select:none;
    touch-action: manipulation;
  }
  .gbtn:active{ transform: scale(0.94); }
  .gbtn small{ font-size:11px; font-weight:700; opacity:0.85; }
  .gbtn.der{ background: linear-gradient(145deg, var(--der), var(--der-dark)); }
  .gbtn.die{ background: linear-gradient(145deg, var(--die), var(--die-dark)); }
  .gbtn.das{ background: linear-gradient(145deg, var(--das), var(--das-dark)); color:#3a2c00; }

  /* ---------- Reveal overlay ---------- */
  .reveal{
    position:fixed;
    inset:0;
    z-index: 50;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding: 24px calc(24px + var(--safe-r)) 24px calc(24px + var(--safe-l));
    opacity:0;
    pointer-events:none;
  }
  .reveal.show{
    opacity:1;
    pointer-events:auto;
    animation: fadeInOverlay 0.18s ease both;
  }
  @keyframes fadeInOverlay{ from{opacity:0;} to{opacity:1;} }

  .reveal.correct.der{ background: radial-gradient(circle at 50% 40%, var(--der) 0%, var(--der-dark) 100%); }
  .reveal.correct.die{ background: radial-gradient(circle at 50% 40%, var(--die) 0%, var(--die-dark) 100%); }
  .reveal.correct.das{ background: radial-gradient(circle at 50% 40%, var(--das) 0%, var(--das-dark) 100%); }
  .reveal.wrong{ background: rgba(45,40,55,0.92); }

  .reveal-title{
    font-size: clamp(28px, 9vw, 46px);
    font-weight:900;
    color:#fff;
    line-height:1.15;
    transform: scale(0.3) rotate(-6deg);
    opacity:0;
  }
  .reveal.correct .reveal-title{
    animation: popMatch 0.55s cubic-bezier(.2,1.4,.4,1) 0.02s forwards;
  }
  .reveal.wrong .reveal-title{
    animation: popWrong 0.4s ease 0.02s forwards;
  }
  @keyframes popMatch{
    0%{ transform: scale(0.3) rotate(-6deg); opacity:0; }
    55%{ transform: scale(1.18) rotate(2deg); opacity:1; }
    75%{ transform: scale(0.95) rotate(-1deg); }
    100%{ transform: scale(1) rotate(0deg); opacity:1; }
  }
  @keyframes popWrong{
    0%{ transform: scale(0.7); opacity:0; }
    100%{ transform: scale(1); opacity:1; }
  }
  .reveal-sub{
    margin-top: 14px;
    font-size: clamp(15px, 4.5vw, 19px);
    color: rgba(255,255,255,0.92);
    font-weight:600;
    opacity:0;
    animation: fadeUp 0.4s ease 0.22s forwards;
  }
  .reveal-meaning{
    margin-top: 6px;
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    font-style: italic;
    opacity:0;
    animation: fadeUp 0.4s ease 0.32s forwards;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .reveal-why{
    margin-top: 12px;
    max-width: 320px;
    font-size: 13px;
    line-height:1.4;
    color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.14);
    border-radius: 12px;
    padding: 8px 14px;
    opacity:0;
    animation: fadeUp 0.4s ease 0.4s forwards;
  }
  .reveal-milestone{
    margin-top: 16px;
    font-size: clamp(16px, 5vw, 21px);
    font-weight:900;
    color:#fff;
    background: rgba(255,255,255,0.16);
    border: 2px solid rgba(255,255,255,0.65);
    border-radius: 16px;
    padding: 8px 18px;
    opacity:0;
  }
  .reveal-milestone.show{
    animation: milestonePop 0.5s cubic-bezier(.2,1.4,.4,1) 0.42s forwards;
  }
  @keyframes milestonePop{
    0%{ transform: scale(0.5); opacity:0; }
    60%{ transform: scale(1.16); opacity:1; }
    100%{ transform: scale(1); opacity:1; }
  }
  .reveal-hint{
    position:absolute;
    bottom: calc(24px + var(--safe-b));
    font-size:12px;
    color: rgba(255,255,255,0.6);
    font-weight:600;
    animation: hintPulse 1.6s ease-in-out infinite;
  }
  @keyframes hintPulse{
    0%, 100%{ opacity:0.5; }
    50%{ opacity:1; }
  }

  .confetti-layer{
    position:absolute; inset:0; overflow:hidden; pointer-events:none;
  }
  .confetti-piece{
    position:absolute;
    top:-20px;
    width:9px; height:14px;
    opacity:0.95;
    animation-name: confettiFall;
    animation-timing-function: cubic-bezier(.3,.6,.7,1);
    animation-fill-mode: forwards;
    border-radius: 2px;
  }
  @keyframes confettiFall{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:1; }
    100%{ transform: translateY(var(--fall,420px)) translateX(var(--drift,0px)) rotate(var(--spin,540deg)); opacity:0; }
  }

  .empty-state{
    text-align:center;
    color: var(--muted);
    font-weight:600;
    padding: 20px;
  }

  @media (max-height: 600px){
    .card .gender-q{ display:none; }
    .card .subhint{ margin-top:4px; }
  }
</style>

    {w:"Tanzen", g:"das", en:"dancing", level:"A2", why:"Infinitives used as nouns are always das"},
    {w:"Fahren", g:"das", en:"driving", level:"A2", why:"Infinitives used as nouns are always das"},

    {w:"Kochen", g:"das", en:"cooking", level:"A2", why:"Infinitives used as nouns are always das"},
    {w:"Lächeln", g:"das", en:"smiling", level:"B1", why:"Infinitives used as nouns are always das"},
    {w:"Aufstehen", g:"das", en:"getting up", level:"B1", why:"Infinitives used as nouns are always das"},
    {w:"Denken", g:"das", en:"thinking", level:"B1", why:"Infinitives used as nouns are always das"},
    {w:"Verstehen", g:"das", en:"understanding", level:"B1", why:"Infinitives used as nouns are always das"},
    {w:"Gold", g:"das", en:"gold", level:"A1", why:"Most metals and chemical elements are das"},
    {w:"Silber", g:"das", en:"silver", level:"A1", why:"Most metals and chemical elements are das"},
    {w:"Eisen", g:"das", en:"iron", level:"A2", why:"Most metals and chemical elements are das"},
    {w:"Kupfer", g:"das", en:"copper", level:"B1", why:"Most metals and chemical elements are das"},
    {w:"Blei", g:"das", en:"lead", level:"B1", why:"Most metals and chemical elements are das"},
    {w:"Zink", g:"das", en:"zinc", level:"B1", why:"Most metals and chemical elements are das"},
    {w:"Aluminium", g:"das", en:"aluminium", level:"B1", why:"Most metals and chemical elements are das"},
    {w:"Quecksilber", g:"das", en:"mercury", level:"B1", why:"Most metals and chemical elements are das"},
    {w:"Platin", g:"das", en:"platinum", level:"B1", why:"Most metals and chemical elements are das"},
    {w:"Titan", g:"das", en:"titanium", level:"B1", why:"Most metals and chemical elements are das"},
    {w:"Blau", g:"das", en:"blue", level:"A1", why:"Colors used as nouns are das"},
    {w:"Rot", g:"das", en:"red", level:"A1", why:"Colors used as nouns are das"},
    {w:"Grün", g:"das", en:"green", level:"A1", why:"Colors used as nouns are das"},
    {w:"Gelb", g:"das", en:"yellow", level:"A1", why:"Colors used as nouns are das"},
    {w:"Schwarz", g:"das", en:"black", level:"A1", why:"Colors used as nouns are das"},
    {w:"Weiß", g:"das", en:"white", level:"A1", why:"Colors used as nouns are das"},
    {w:"Braun", g:"das", en:"brown", level:"A2", why:"Colors used as nouns are das"},
    {w:"Grau", g:"das", en:"gray", level:"A2", why:"Colors used as nouns are das"},
    {w:"Bier", g:"das", en:"beer", level:"A1", why:"Exception: unlike most alcoholic drinks (der), Bier is das"}
  ];

  var LEVELS = ["A1", "A2", "B1"];
  var currentLevel = "A1";
  var activePool = [];

  function rebuildPool(){
    activePool = ALL_WORDS.filter(function(w){ return w.level === currentLevel; });
  }

  var GENDER_META = {
    der: {emoji:"💙", label:"der", color:"#2F6FED"},
    die: {emoji:"💕", label:"die", color:"#FF3E7C"},
    das: {emoji:"💛", label:"das", color:"#F2B705"}
  };

  var MILESTONE_MESSAGES = [
    "You're on fire!",
    "Unstoppable!",
    "Genius mode!",
    "Absolutely crushing it!",
    "German pro!"
  ];

  // ---------------- Sound effects (synthesized, no audio files) ----------------
  var audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone(ctx, freq, startOffset, duration, type, peakGain){
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    var t0 = ctx.currentTime + startOffset;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(peakGain, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function playCorrectSound(){
    var ctx = getAudioCtx();
    if (!ctx) return;
    playTone(ctx, 880, 0, 0.15, "sine", 0.2);
    playTone(ctx, 1318.51, 0.08, 0.22, "sine", 0.18);
  }

  function playWrongSound(){
    var ctx = getAudioCtx();
    if (!ctx) return;
    playTone(ctx, 320, 0, 0.16, "sine", 0.14);
    playTone(ctx, 200, 0.09, 0.24, "sine", 0.11);
  }

  function playMilestoneSound(){
    var ctx = getAudioCtx();
    if (!ctx) return;
    playTone(ctx, 659.25, 0, 0.14, "triangle", 0.22);
    playTone(ctx, 783.99, 0.11, 0.14, "triangle", 0.22);
    playTone(ctx, 1046.50, 0.22, 0.32, "triangle", 0.26);
  }

  // ---------------- Analytics (Vercel Web Analytics) ----------------
  function trackEvent(name, data){
    if (typeof window.va === "function"){
      window.va("event", { name: name, data: data });
    }
  }

  // ---------------- In-memory state ----------------
  var correctCount = 0;
  var totalCount = 0;
  var streak = 0;
  var deck = [];
  var lastWordShown = null;
  var upcoming = []; // 3 word objects currently assigned to pos-0/1/2

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function refillDeck(){
    deck = shuffle(activePool);
    // avoid immediate repeat of the last word seen across a reshuffle boundary
    if (lastWordShown && deck.length && deck[0].w === lastWordShown){
      deck.push(deck.shift());
    }
  }

  function nextWord(){
    if (deck.length === 0) refillDeck();
    var w = deck.shift();
    lastWordShown = w.w;
    return w;
  }

  // ---------------- DOM refs ----------------
  var stackEl = document.getElementById("stack");
  var cardEls = Array.prototype.slice.call(stackEl.querySelectorAll(".card"));
  var scorePill = document.getElementById("scorePill");
  var streakPill = document.getElementById("streakPill");
  var streakVal = document.getElementById("streakVal");
  var revealEl = document.getElementById("reveal");
  var revealTitle = document.getElementById("revealTitle");
  var revealSub = document.getElementById("revealSub");
  var revealMeaning = document.getElementById("revealMeaning");
  var revealWhy = document.getElementById("revealWhy");
  var revealMilestone = document.getElementById("revealMilestone");
  var confettiLayer = document.getElementById("confettiLayer");
  var levelGroup = document.getElementById("levelGroup");
  var levelButtons = Array.prototype.slice.call(levelGroup.querySelectorAll(".level-btn"));

  // stackOrder[0] = DOM element index currently at pos-0 (top/interactive), etc.
  var stackOrder = [0, 1, 2];
  var locked = false; // true while a swipe/reveal animation is in progress

  function applyPositions(withTransition){
    for (var pos = 0; pos < 3; pos++){
      var el = cardEls[stackOrder[pos]];
      el.classList.remove("pos-0", "pos-1", "pos-2", "dragging");
      if (!withTransition) {
        el.classList.add("dragging"); // reuse to strip transition instantly
      }
      el.classList.add("pos-" + pos);
      // force reflow then remove the dragging class so future transitions work
      if (!withTransition) {
        void el.offsetWidth;
        el.classList.remove("dragging");
      }
    }
  }

  function setCardWord(domIndex, wordObj){
    var el = cardEls[domIndex];
    el.dataset.word = wordObj.w;
    el.dataset.gender = wordObj.g;
    el.dataset.en = wordObj.en;
    el.querySelector(".word").textContent = wordObj.w;
    var stamps = el.querySelectorAll(".stamp");
    for (var i=0;i<stamps.length;i++){ stamps[i].style.opacity = 0; }
  }

  function initStack(){
    upcoming = [nextWord(), nextWord(), nextWord()];
    for (var i = 0; i < 3; i++){
      setCardWord(i, upcoming[i]);
    }
    stackOrder = [0, 1, 2];
    applyPositions(false);
  }

  function updateScoreUI(){
    scorePill.textContent = correctCount + " / " + totalCount;
    if (streak >= 2){
      streakPill.style.display = "inline-flex";
      streakVal.textContent = streak;
    } else {
      streakPill.style.display = "none";
    }
  }

  function pulseStreak(){
    streakPill.classList.remove("hot");
    void streakPill.offsetWidth;
    streakPill.classList.add("hot");
  }

  // ---------------- Drag handling ----------------
  var drag = null; // {domIndex, startX, startY, dx, dy, pointerId}
  var THRESH_X = 100;
  var THRESH_Y = 90;

  function topDomIndex(){ return stackOrder[0]; }

  function onPointerDown(e){
    if (locked) return;
    var el = e.currentTarget;
    if (cardEls.indexOf(el) !== topDomIndex()) return;
    drag = {
      domIndex: cardEls.indexOf(el),
      startX: e.clientX,
      startY: e.clientY,
      dx: 0, dy: 0,
      pointerId: e.pointerId
    };
    el.classList.add("dragging");
    try { el.setPointerCapture(e.pointerId); } catch(err){}
  }

  function onPointerMove(e){
    if (!drag || e.pointerId !== drag.pointerId) return;
    var el = cardEls[drag.domIndex];
    drag.dx = e.clientX - drag.startX;
    drag.dy = e.clientY - drag.startY;
    var rot = Math.max(-22, Math.min(22, drag.dx * 0.09));
    el.style.transform = "translate(" + drag.dx + "px," + drag.dy + "px) rotate(" + rot + "deg)";

    var absX = Math.abs(drag.dx), absY = Math.abs(drag.dy);
    var stampDer = el.querySelector(".stamp.der");
    var stampDie = el.querySelector(".stamp.die");
    var stampDas = el.querySelector(".stamp.das");
    stampDer.style.opacity = 0; stampDie.style.opacity = 0; stampDas.style.opacity = 0;

    if (absY > absX && drag.dy < 0){
      stampDas.style.opacity = Math.min(1, absY / THRESH_Y);
    } else if (drag.dx < 0){
      stampDer.style.opacity = Math.min(1, absX / THRESH_X);
    } else if (drag.dx > 0){
      stampDie.style.opacity = Math.min(1, absX / THRESH_X);
    }
  }

  function detectDirection(dx, dy){
    var absX = Math.abs(dx), absY = Math.abs(dy);
    if (absY > absX && dy < -THRESH_Y) return "das";
    if (absX >= absY && dx <= -THRESH_X) return "der";
    if (absX >= absY && dx >= THRESH_X) return "die";
    return null;
  }

  function onPointerUp(e){
    if (!drag || e.pointerId !== drag.pointerId) return;
    var el = cardEls[drag.domIndex];
    var dir = detectDirection(drag.dx, drag.dy);
    el.classList.remove("dragging");
    if (dir){
      commitSwipe(dir, el);
    } else {
      el.style.transform = "";
    }
    drag = null;
  }

  cardEls.forEach(function(el){
    el.addEventListener("pointerdown", onPointerDown);
    el.addEventListener("pointermove", onPointerMove);
    el.addEventListener("pointerup", onPointerUp);
    el.addEventListener("pointercancel", onPointerUp);
  });

  // ---------------- Buttons + keyboard fallback ----------------
  document.querySelectorAll(".gbtn").forEach(function(btn){
    btn.addEventListener("click", function(){
      if (locked) return;
      var el = cardEls[topDomIndex()];
      commitSwipe(btn.dataset.g, el);
    });
  });

  window.addEventListener("keydown", function(e){
    if (revealEl.classList.contains("show")){
      e.preventDefault();
      hideReveal();
      return;
    }
    if (locked) return;
    var map = {ArrowLeft:"der", ArrowRight:"die", ArrowUp:"das"};
    var g = map[e.key];
    if (!g) return;
    e.preventDefault();
    var el = cardEls[topDomIndex()];
    commitSwipe(g, el);
  });

  // ---------------- Commit swipe + reveal ----------------
  var flyOffTransform = {
    der: "translate(-160%, 10px) rotate(-32deg)",
    die: "translate(160%, 10px) rotate(32deg)",
    das: "translate(0, -170%) rotate(3deg)"
  };

  function commitSwipe(direction, el){
    locked = true;
    var domIndex = cardEls.indexOf(el);
    var wordObj = upcoming[domIndex];
    var isCorrect = direction === wordObj.g;

    el.classList.remove("dragging");
    el.style.transition = "transform 0.38s cubic-bezier(.3,.6,.4,1), opacity 0.38s ease, filter 0.38s ease";
    el.style.transform = flyOffTransform[direction];
    if (!isCorrect){
      el.style.filter = "grayscale(0.6) brightness(0.95)";
      el.style.opacity = "0.5";
    }

    totalCount++;
    if (isCorrect){
      correctCount++;
      streak++;
      pulseStreak();
      playCorrectSound();
    } else {
      streak = 0;
      playWrongSound();
    }
    updateScoreUI();
    trackEvent(isCorrect ? "swipe_correct" : "swipe_wrong", {
      word: wordObj.w,
      gender: wordObj.g,
      guessed: direction
    });

    showReveal(isCorrect, wordObj, direction);

    setTimeout(function(){
      advanceStack(domIndex);
    }, 220);
  }

  function advanceStack(domIndex){
    var el = cardEls[domIndex];
    el.style.transition = "";
    el.style.transform = "";
    el.style.filter = "";
    el.style.opacity = "";

    var w = nextWord();
    setCardWord(domIndex, w);
    upcoming[domIndex] = w;

    stackOrder = [stackOrder[1], stackOrder[2], stackOrder[0]];
    applyPositions(false);
  }

  function spawnConfetti(color, big){
    confettiLayer.innerHTML = "";
    var colors = [color, "#ffffff", "#ffe066", "#ff8fab"];
    var count = big ? 42 : 22;
    for (var i = 0; i < count; i++){
      var piece = document.createElement("div");
      piece.className = "confetti-piece";
      var left = Math.random() * 100;
      var fall = 260 + Math.random() * 220;
      var drift = (Math.random() - 0.5) * 160;
      var spin = 360 + Math.random() * 540;
      var dur = 0.9 + Math.random() * 0.8;
      var delay = Math.random() * 0.15;
      piece.style.left = left + "%";
      piece.style.background = colors[i % colors.length];
      piece.style.setProperty("--fall", fall + "px");
      piece.style.setProperty("--drift", drift + "px");
      piece.style.setProperty("--spin", spin + "deg");
      piece.style.animationDuration = dur + "s";
      piece.style.animationDelay = delay + "s";
      confettiLayer.appendChild(piece);
    }
  }

  function showReveal(isCorrect, wordObj, direction){
    revealEl.className = "reveal show " + (isCorrect ? "correct " + wordObj.g : "wrong");

    var isMilestone = isCorrect && streak > 0 && streak % 5 === 0;

    if (isCorrect){
      var meta = GENDER_META[wordObj.g];
      revealTitle.textContent = "It's " + wordObj.g + " " + wordObj.w + "! " + meta.emoji;
      revealSub.textContent = "Nice! You're on a roll.";
      spawnConfetti(meta.color, isMilestone);
    } else {
      revealTitle.textContent = "Actually, " + wordObj.g + " " + wordObj.w;
      revealSub.textContent = "You said " + direction + " — close, keep going!";
      confettiLayer.innerHTML = "";
    }
    revealMeaning.textContent = "“" + wordObj.en + "”";
    revealWhy.textContent = "💡 " + wordObj.why;

    revealMilestone.classList.remove("show");
    if (isMilestone){
      var phrase = MILESTONE_MESSAGES[(streak / 5 - 1) % MILESTONE_MESSAGES.length];
      revealMilestone.textContent = "🎉 " + streak + " in a row — " + phrase;
      void revealMilestone.offsetWidth;
      revealMilestone.classList.add("show");
      playMilestoneSound();
      trackEvent("streak_milestone", { streak: streak });
    } else {
      revealMilestone.textContent = "";
    }

    // retrigger pop animation
    revealTitle.style.animation = "none";
    void revealTitle.offsetWidth;
    revealTitle.style.animation = "";
  }

  function hideReveal(){
    revealEl.classList.remove("show");
    revealMilestone.classList.remove("show");
    confettiLayer.innerHTML = "";
    locked = false;
  }

  revealEl.addEventListener("click", function(){
    if (!revealEl.classList.contains("show")) return;
    hideReveal();
  });

  // ---------------- CEFR level selector ----------------
  function updateLevelButtons(){
    levelButtons.forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.level === currentLevel);
    });
  }

  function switchLevel(newLevel){
    if (newLevel === currentLevel) return;
    currentLevel = newLevel;

    // cancel any in-progress drag/reveal and reset card visuals
    drag = null;
    locked = false;
    revealEl.classList.remove("show");
    revealMilestone.classList.remove("show");
    confettiLayer.innerHTML = "";
    cardEls.forEach(function(el){
      el.classList.remove("dragging");
      el.style.transition = "";
      el.style.transform = "";
      el.style.filter = "";
      el.style.opacity = "";
    });

    // reset score/streak — a new level pool is a fresh session
    correctCount = 0;
    totalCount = 0;
    streak = 0;
    updateScoreUI();

    // rebuild the pool for the new level and reshuffle the deck
    rebuildPool();
    deck = [];
    lastWordShown = null;
    initStack();

    updateLevelButtons();
  }

  levelButtons.forEach(function(btn){
    btn.addEventListener("click", function(){
      switchLevel(btn.dataset.level);
    });
  });

  // ---------------- Boot ----------------
  rebuildPool();
  refillDeck();
  initStack();
  updateScoreUI();
})();
</script>
